services:
  redis:
    image: redis:7
    container_name: redis-limiter
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    container_name: rate-limiter-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    env_file:
      - .env

volumes:
  redis-data:
